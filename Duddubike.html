<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DUDU Bike - Xanh SM v15h3</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --cyan: #00b0b9;
            --cyan-dark: #008a91;
            --cyan-light: #e0f7f9;
            --orange: #ff8c00;
            --white: #ffffff;
            --text: #1a3c3e;
            --text-light: #5a7a7c;
            --shadow: 0 8px 30px rgba(0,176,185,0.2);
            --radius: 25px;
            --radius-sm: 18px;
            --red: #f44336;
            --green: #4caf50;
            --blue: #2196F3;
            --pink: #e91e63;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(160deg, #e8f8f9, #d4f1f3, #e0f7f9, #fdf2e0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .phone-frame {
            width: 100%;
            max-width: 440px;
            height: 92vh;
            max-height: 900px;
            background: var(--white);
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 0 0 8px #1a1a1a, 0 0 0 11px #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .dynamic-island {
            width: 100px; height: 28px; background: #1a1a1a;
            border-radius: 20px; margin: 8px auto 2px; flex-shrink: 0;
        }
        .app-content {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 14px;
        }
        .screen { display:none; flex-direction:column; align-items:center; min-height:100%; }
        .screen.active { display:flex; }
        .btn {
            display:inline-flex; align-items:center; justify-content:center; gap:6px;
            padding:13px 22px; border-radius:var(--radius); font-size:15px; font-weight:700;
            border:none; cursor:pointer; transition:0.3s; font-family:inherit; color:#fff;
            -webkit-tap-highlight-color:transparent; user-select:none; outline:none;
        }
        .btn:active { transform:scale(0.94); }
        .btn-primary { background:var(--cyan); box-shadow:var(--shadow); }
        .btn-orange { background:var(--orange); box-shadow:0 8px 25px rgba(255,140,0,0.35); }
        .btn-red { background:var(--red); }
        .btn-green { background:var(--green); }
        .btn-blue { background:var(--blue); }
        .btn-pink { background:var(--pink); }
        .btn-outline { background:#fff; color:var(--cyan); border:2.5px solid var(--cyan); }
        .btn-sm { padding:9px 16px; font-size:13px; border-radius:var(--radius-sm); }
        .btn-full { width:100%; }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .bubble-card {
            background:var(--white); border-radius:var(--radius); padding:16px;
            box-shadow:var(--shadow); width:100%; margin-bottom:12px;
            border:1px solid rgba(0,176,185,0.08);
        }
        .input-bubble {
            width:100%; padding:12px 16px; border-radius:var(--radius-sm);
            border:2px solid #e0eaea; font-size:14px; font-family:inherit;
            background:#f9fdfd; color:var(--text); outline:none; transition:0.3s;
        }
        .input-bubble:focus { border-color:var(--cyan); box-shadow:0 0 0 4px rgba(0,176,185,0.08); }
        .screen-header { text-align:center; margin-bottom:10px; width:100%; }
        .greeting { font-size:20px; font-weight:800; color:var(--cyan-dark); margin-bottom:4px; }
        .subtitle { font-size:13px; color:var(--text-light); }
        .quick-locations { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; width:100%; }
        .quick-loc-btn {
            flex:1; min-width:80px; padding:10px 8px; border-radius:var(--radius-sm);
            background:var(--cyan-light); border:2px solid transparent; font-size:12px;
            font-weight:600; cursor:pointer; color:var(--cyan-dark); text-align:center;
        }
        .quick-loc-btn.active { background:var(--cyan); color:#fff; }
        .map-thumb {
            width:100%; height:200px; border-radius:var(--radius); overflow:hidden;
            box-shadow:var(--shadow); border:3px solid #fff; margin-bottom:12px;
        }
        .order-card {
            background:#fff; border-radius:var(--radius); padding:16px;
            box-shadow:var(--shadow); margin-bottom:10px; border-left:5px solid var(--orange);
        }
        .order-card .dest-name { font-weight:700; font-size:16px; color:var(--text); margin-bottom:4px; }
        .order-card .meta { font-size:12px; color:var(--text-light); margin-bottom:8px; }
        .order-card .actions { display:flex; gap:8px; flex-wrap:wrap; }
        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.6); z-index:1000; display:none;
            align-items:center; justify-content:center; backdrop-filter:blur(4px);
        }
        .modal-overlay.show { display:flex; }
        .modal-box {
            background:#fff; border-radius:30px; padding:24px 20px; text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,0.3); max-width:360px; width:90%;
        }
        .stars { display:flex; justify-content:center; gap:8px; margin:16px 0; font-size:36px; cursor:pointer; }
        .stars .star { color:#ccc; transition:0.2s; }
        .stars .star.active, .stars .star:hover { color:#FFD700; transform:scale(1.2); }
        .map-modal-content {
            max-width:400px; height:70vh; display:flex; flex-direction:column;
        }
        .map-container {
            flex:1; border-radius:20px; overflow:hidden; margin-bottom:12px;
            border:2px solid var(--cyan-light); min-height:200px;
        }
        .password-popup {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7); z-index:2000; display:none;
            align-items:center; justify-content:center; backdrop-filter:blur(6px);
        }
        .password-popup.show { display:flex; }
        .password-bubble {
            background:#fff; border-radius:30px; padding:26px 20px; text-align:center;
            box-shadow:0 20px 50px rgba(0,0,0,0.4); max-width:340px; width:90%;
        }
        .error-msg { color:#e53935; font-size:12px; margin-top:4px; display:none; }
        .toast {
            position:fixed; top:20px; left:50%; transform:translateX(-50%);
            background:#1a3c3e; color:#fff; padding:10px 20px; border-radius:30px;
            font-weight:600; font-size:13px; z-index:3000;
            box-shadow:0 8px 30px rgba(0,0,0,0.3); pointer-events:none; transition:opacity 0.4s;
        }
        .toast.error { background:#e53935; }
        .toast.success { background:#2e7d32; }
        .search-results {
            width:100%; background:#fff; border-radius:var(--radius-sm);
            box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
            display:none;
        }
        .search-results.show { display:block; }
        .search-item {
            padding:12px 16px; border-bottom:1px solid #eee; cursor:pointer; font-size:14px;
        }
        .search-item:hover { background:var(--cyan-light); }
    </style>
</head>
<body>
<div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="app-content" id="appContent">

        <!-- MÀN CHỌN VAI TRÒ -->
        <div class="screen active" id="roleScreen">
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;">
                <div style="font-size:48px;">🛵💨</div>
                <div style="font-size:26px; font-weight:800; color:var(--cyan);">DUDU Bike</div>
                <div style="font-size:14px; color:var(--text-light); margin-bottom:24px;">Xanh SM v15h3</div>
                <p style="font-size:15px; color:var(--text-light); margin-bottom:20px;">Chọn vai trò:</p>
                <button class="btn btn-primary btn-full" id="btnRoleMom" style="max-width:300px; margin-bottom:10px;">👩‍🦰 Mẹ đặt xe</button>
                <button class="btn btn-orange btn-full" id="btnRoleDriver" style="max-width:300px;">🧑‍✈️ Tài xế Đu Đủ</button>
            </div>
        </div>

        <!-- MÀN MẸ -->
        <div class="screen" id="momScreen">
            <div class="screen-header">
                <div class="greeting">Chào mẹ yêu! ❤️</div>
                <div class="subtitle">Mẹ muốn đi đâu ạ?</div>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:12px; width:100%;">
                <input type="text" class="input-bubble" id="searchInput" placeholder="Nhập địa chỉ..." />
                <button class="btn btn-primary btn-sm" id="btnSearch">🔍</button>
            </div>
            <div class="search-results" id="searchResults"></div>
            <div id="momMapThumb" class="map-thumb"></div>
            <button class="btn btn-outline btn-sm btn-full" id="btnMomGps" style="margin-bottom:8px;">📍 Lấy vị trí của Mẹ</button>
            <div class="quick-locations">
                <button class="quick-loc-btn active" data-dest="🏠 58 Phùng Khoang" data-lat="20.9822" data-lng="105.8016">🏠 Nhà</button>
                <button class="quick-loc-btn" data-dest="🛒 Chợ Thanh Xuân" data-lat="20.9850" data-lng="105.8050">🛒 Chợ</button>
                <button class="quick-loc-btn" data-dest="🏫 Đại học Hà Nội" data-lat="20.9805" data-lng="105.7978">🏫 Trường</button>
            </div>
            <div class="bubble-card" style="text-align:center;">
                <div style="font-weight:700;" id="selectedDestDisplay">🏠 58 Phùng Khoang</div>
            </div>
            <div style="width:100%; margin-bottom:10px;">
                <label style="font-weight:600; font-size:13px; color:var(--text-light);">⏰ Hẹn giờ:</label>
                <input type="datetime-local" class="input-bubble" id="pickupTime" />
            </div>
            <button class="btn btn-orange btn-full" id="btnPlaceOrder" style="font-size:18px;">🛵 ĐẶT TÀI XẾ LÊ THÁI MINH</button>
            <div id="orderStatusArea" style="width:100%; margin-top:16px; text-align:center; font-weight:600;"></div>
        </div>

        <!-- MÀN TÀI XẾ -->
        <div class="screen" id="driverScreen">
            <div class="screen-header">
                <div style="font-weight:800; font-size:22px; color:var(--orange);">👨‍✈️ Tài xế: Lê Thái Minh</div>
                <div class="bubble-card" style="text-align:center; background:linear-gradient(135deg,#fff8e1,#fff3e0); border:2px solid var(--orange); margin-top:10px;">
                    <span style="font-weight:700;">🏆 ĐIỂM HIẾU THẢO: </span>
                    <span style="font-size:32px; font-weight:900; color:var(--orange);" id="loyaltyPoints">217.7</span>
                </div>
            </div>
            <div style="width:100%;"><h3 style="color:var(--text); margin-bottom:8px;">📋 Cuốc xe đang chờ:</h3><div id="driverOrdersList"></div></div>
        </div>
    </div>
</div>

<!-- MODAL ĐÁNH GIÁ -->
<div class="modal-overlay" id="ratingModal">
    <div class="modal-box">
        <h3>⭐ Mẹ đánh giá chuyến đi</h3>
        <div class="stars" id="starContainer">
            <span class="star" data-value="1">☆</span><span class="star" data-value="2">☆</span><span class="star" data-value="3">☆</span><span class="star" data-value="4">☆</span><span class="star" data-value="5">☆</span>
        </div>
        <textarea class="input-bubble" id="ratingComment" placeholder="Lời nhắn..." rows="2" style="margin-bottom:12px;"></textarea>
        <button class="btn btn-orange btn-full" id="btnSubmitRating">📨 Gửi</button>
        <button class="btn btn-outline btn-sm" style="margin-top:6px;" id="btnSkipRating">Để sau</button>
    </div>
</div>

<!-- MODAL BẢN ĐỒ TÀI XẾ -->
<div class="modal-overlay" id="mapModal">
    <div class="modal-box map-modal-content">
        <h3 style="margin-bottom:8px;">🗺️ Bản đồ</h3>
        <div id="leafletMap" class="map-container"></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-blue btn-sm" id="btnAppleMaps" style="flex:1;">🧭 Apple Maps</button>
            <button class="btn btn-outline btn-sm" id="btnGoogleMaps" style="flex:1;">🧭 Google Maps</button>
            <button class="btn btn-red btn-sm" id="btnCloseMap" style="flex:1;">Đóng</button>
        </div>
    </div>
</div>

<!-- POPUP MẬT KHẨU -->
<div class="password-popup" id="pwPopup">
    <div class="password-bubble">
        <div style="font-size:44px;">🔐</div>
        <h3>Xác minh Tài xế</h3>
        <p style="font-size:13px; color:var(--text-light); margin-bottom:12px;">Nhập mật khẩu</p>
        <input type="password" class="input-bubble" id="pwInput" placeholder="Mật khẩu..." style="text-align:center; font-size:18px;" />
        <p class="error-msg" id="pwError">❌ Sai mật khẩu!</p>
        <div style="display:flex; gap:10px; margin-top:14px;">
            <button class="btn btn-outline btn-sm" id="btnCancelPw" style="flex:1;">Hủy</button>
            <button class="btn btn-orange btn-sm" id="btnConfirmPw" style="flex:1;">Xác nhận</button>
        </div>
    </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
    const SUPABASE_URL = "https://hfrqvmfzzgfwiahkozqy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_4GEXwOZM8cT8jQZleAJIqg_oCXAh9IO";
    const PASSWORD = "dudubike2026";
    const $ = id => document.getElementById(id);

    let supabase;
    try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) { console.error(e); }

    let currentRole = null;
    let destName = "🏠 58 Phùng Khoang", destLat = 20.9822, destLng = 105.8016;
    let momMap = null, momMarker = null, momGpsMarker = null;
    let currentOrderId = null, allOrders = [];
    let mapModalInstance = null, pendingRatingOrder = null;

    // ========== MÀN HÌNH ==========
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        $(id).classList.add('active');
        if (id === 'momScreen') {
            initMomMap();
            checkPendingRating(); // kiểm tra đánh giá tồn đọng
        }
        if (id === 'driverScreen') loadDriverOrders();
    }

    // ========== KIỂM TRA ĐÁNH GIÁ TỒN ĐỌNG ==========
    async function checkPendingRating() {
        if (!supabase || currentRole !== 'mom') return;
        const { data } = await supabase
            .from('orders')
            .select('*')
            .eq('driver_id', 'dudu_minh')
            .eq('status', 'completed')
            .is('rating', null)
            .order('created_at', { ascending: false })
            .limit(1);
        if (data && data.length > 0 && data[0].rating === null) {
            pendingRatingOrder = data[0];
            openRating(data[0].id);
        }
    }

    // ========== BẢN ĐỒ MẸ ==========
    function initMomMap() {
        if (momMap) return;
        momMap = L.map('momMapThumb', { center: [destLat, destLng], zoom: 15, zoomControl: false, attributionControl: false });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(momMap);
        momMarker = L.marker([destLat, destLng], { draggable: true }).addTo(momMap);
        momMarker.on('dragend', () => {
            const p = momMarker.getLatLng();
            destLat = p.lat; destLng = p.lng;
            destName = "📍 Vị trí tự chọn";
            updateMomUI();
        });
        updateMomUI();
    }
    function updateMomUI() {
        $('selectedDestDisplay').textContent = destName;
        document.querySelectorAll('.quick-loc-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.querySelector(`.quick-loc-btn[data-lat="${destLat}"][data-lng="${destLng}"]`);
        if (activeBtn) activeBtn.classList.add('active');
    }
    function moveMomMarker(lat, lng, name) {
        destLat = lat; destLng = lng; destName = name;
        if (momMap) {
            momMap.setView([lat, lng], 15);
            momMarker.setLatLng([lat, lng]);
        }
        updateMomUI();
    }
    async function searchAddress() {
        const query = $('searchInput').value.trim();
        if (!query) return;
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=4&accept-language=vi`);
            const data = await res.json();
            const container = $('searchResults');
            if (data.length === 0) {
                container.innerHTML = '<div class="search-item">Không tìm thấy</div>';
            } else {
                container.innerHTML = data.map(r => `<div class="search-item" onclick="window.selectSearchResult(${r.lat},${r.lon},'${r.display_name.replace(/'/g,"\\'")}')">📍 ${r.display_name.split(',')[0]}</div>`).join('');
            }
            container.classList.add('show');
        } catch (e) {
            toast("Lỗi tìm kiếm", "error");
        }
    }
    window.selectSearchResult = function(lat, lng, name) {
        moveMomMarker(parseFloat(lat), parseFloat(lng), "📍 " + name.split(',')[0]);
        $('searchResults').classList.remove('show');
        $('searchInput').value = '';
    };
    function getMomGps() {
        if (!navigator.geolocation) return toast("GPS không khả dụng", "error");
        navigator.geolocation.getCurrentPosition(pos => {
            const { latitude, longitude } = pos.coords;
            if (momMap) {
                if (momGpsMarker) momMap.removeLayer(momGpsMarker);
                momGpsMarker = L.marker([latitude, longitude], { icon: L.divIcon({ html: '👩‍🦰', iconSize: [24,24], className: '' }) }).addTo(momMap);
                momMap.setView([latitude, longitude], 15);
            }
            toast("✅ Đã thấy mẹ!");
        }, err => toast("Không lấy được GPS", "error"), { enableHighAccuracy: true });
    }

    // ========== MẸ ĐẶT XE ==========
    async function placeOrder() {
        if (!supabase) return toast("Chưa kết nối", "error");
        const pickup = $('pickupTime').value || 'Ngay bây giờ';
        const btn = $('btnPlaceOrder');
        btn.disabled = true; btn.textContent = "Đang gửi...";
        const payload = { destination: destName, lat: destLat, lng: destLng, pickup_time: pickup, status: 'waiting', driver_id: 'dudu_minh' };
        if (momGpsMarker) {
            const gps = momGpsMarker.getLatLng();
            payload.mom_lat = gps.lat;
            payload.mom_lng = gps.lng;
        }
        const { data, error } = await supabase.from('orders').insert([payload]).select();
        if (error) { toast("Lỗi: " + error.message, "error"); btn.disabled = false; btn.textContent = "🛵 ĐẶT TÀI XẾ"; return; }
        if (data && data[0]) {
            currentOrderId = data[0].id;
            toast("✅ Đặt xe thành công!");
            listenMomOrder(currentOrderId);
        }
        btn.disabled = false; btn.textContent = "🛵 ĐẶT TÀI XẾ LÊ THÁI MINH";
    }
    function listenMomOrder(orderId) {
        if (!supabase) return;
        supabase.channel('mom-' + orderId)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `id=eq.${orderId}` }, (p) => {
                const s = p.new.status;
                const area = $('orderStatusArea');
                if (s === 'arrived') area.innerHTML = '<div style="color:#ff8c00; font-size:18px;">🚀 Đang đến đón!</div>';
                else if (s === 'cancelled') area.innerHTML = '<div style="color:#f44336; font-size:18px;">❌ Cuốc xe bị hủy!</div>';
                else if (s === 'completed') {
                    area.innerHTML = '<div style="color:#4caf50; font-size:18px;">✅ Hoàn thành!</div>';
                    openRating(orderId);
                }
            }).subscribe();
    }

    // ========== ĐÁNH GIÁ ==========
    let starVal = 0;
    function openRating(orderId) {
        starVal = 0;
        document.querySelectorAll('#starContainer .star').forEach(s => { s.classList.remove('active'); s.textContent = '☆'; });
        $('ratingComment').value = '';
        $('ratingModal').classList.add('show');
        currentOrderId = orderId;
    }
    document.querySelectorAll('#starContainer .star').forEach(s => s.addEventListener('click', function() {
        starVal = +this.dataset.value;
        document.querySelectorAll('#starContainer .star').forEach(st => {
            st.classList.toggle('active', +st.dataset.value <= starVal);
            st.textContent = +st.dataset.value <= starVal ? '★' : '☆';
        });
    }));
    async function submitRating() {
        if (!starVal) return toast("⭐ Chọn sao nhé!");
        const cmt = $('ratingComment').value.trim();
        await supabase.from('orders').update({ rating: starVal, comment: cmt }).eq('id', currentOrderId);
        $('ratingModal').classList.remove('show');
        $('orderStatusArea').innerHTML = '';
        pendingRatingOrder = null;
        toast("🎉 Cảm ơn mẹ! Mời mẹ đặt chuyến mới.");
    }
    function skipRating() {
        $('ratingModal').classList.remove('show');
        $('orderStatusArea').innerHTML = '';
        pendingRatingOrder = null;
    }

    // ========== TÀI XẾ ==========
    async function loadDriverOrders() {
        if (!supabase) return;
        const { data } = await supabase.from('orders').select('*').order('created_at', { ascending: false }).limit(20);
        allOrders = data || [];
        renderDriverOrders();
    }
    function renderDriverOrders() {
        const waiting = allOrders.filter(o => o.status === 'waiting' || !o.status);
        const active = allOrders.filter(o => o.status === 'arrived');
        const list = [...waiting, ...active];
        const container = $('driverOrdersList');
        if (!list.length) { container.innerHTML = '<p style="text-align:center; color:var(--text-light);">Chưa có cuốc mới...</p>'; return; }
        container.innerHTML = list.map(o => {
            const momLat = o.mom_lat, momLng = o.mom_lng;
            return `
            <div class="order-card">
                <div class="dest-name">${o.destination || '?'}</div>
                <div class="meta">🕐 ${o.pickup_time || 'Ngay'} | 📍 ${(o.lat||0).toFixed(4)}, ${(o.lng||0).toFixed(4)}</div>
                <div class="actions">
                    <button class="btn btn-blue btn-sm" onclick="openMapModal(${o.lat},${o.lng},'${(o.destination||'').replace(/'/g,"\\'")}',${momLat||0},${momLng||0})">🗺️ XEM BẢN ĐỒ</button>
                </div>
                <div class="actions" style="margin-top:6px;">
                    ${momLat && momLng ? `<button class="btn btn-pink btn-sm" onclick="navigateToMom(${momLat},${momLng})">📍 Đến chỗ Mẹ</button>` : ''}
                    <button class="btn btn-orange btn-sm" onclick="acceptOrder('${o.id}')">🚀 BẮT ĐẦU ĐÓN</button>
                    <button class="btn btn-red btn-sm" onclick="cancelOrder('${o.id}')">❌ HỦY</button>
                </div>
                <button class="btn btn-green btn-full btn-sm" style="margin-top:6px;" onclick="completeOrder('${o.id}')">🏁 HOÀN THÀNH</button>
            </div>`;
        }).join('');
    }
    window.navigateToMom = (momLat, momLng) => {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${momLat},${momLng}`, '_blank');
    };
    window.acceptOrder = async (id) => {
        await supabase.from('orders').update({ status: 'arrived' }).eq('id', id);
        loadDriverOrders(); toast("🚀 Đang đến đón!");
    };
    window.cancelOrder = async (id) => {
        await supabase.from('orders').update({ status: 'cancelled' }).eq('id', id);
        loadDriverOrders(); toast("❌ Đã hủy");
    };
    window.completeOrder = async (id) => {
        await supabase.from('orders').update({ status: 'completed' }).eq('id', id);
        let pts = parseFloat(localStorage.getItem('dudu_points') || '217.7');
        pts = Math.round((pts + 25.7) * 10) / 10;
        localStorage.setItem('dudu_points', pts);
        $('loyaltyPoints').textContent = pts.toFixed(1);
        loadDriverOrders(); toast("🏁 Hoàn thành! +25.7 điểm");
    };

    // ========== BẢN ĐỒ MODAL ==========
    window.openMapModal = function(dLat, dLng, title, mLat, mLng) {
        $('mapModal').classList.add('show');
        if (mapModalInstance) mapModalInstance.remove();
        setTimeout(() => {
            mapModalInstance = L.map('leafletMap', { center: [dLat, dLng], zoom: 15, zoomControl: true });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapModalInstance);
            L.marker([dLat, dLng]).addTo(mapModalInstance).bindPopup(title).openPopup();
            if (mLat && mLng) {
                L.marker([mLat, mLng], { icon: L.divIcon({ html: '👩‍🦰', iconSize: [24,24], className: '' }) }).addTo(mapModalInstance);
            }
            mapModalInstance.invalidateSize();
        }, 200);
        $('btnAppleMaps').onclick = () => {
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS) window.location.href = `maps://?daddr=${dLat},${dLng}`;
            else window.open(`https://www.google.com/maps/dir/?api=1&destination=${dLat},${dLng}`, '_blank');
        };
        $('btnGoogleMaps').onclick = () => window.open(`https://www.google.com/maps/dir/?api=1&destination=${dLat},${dLng}`, '_blank');
    };
    $('btnCloseMap').addEventListener('click', () => {
        $('mapModal').classList.remove('show');
        if (mapModalInstance) { mapModalInstance.remove(); mapModalInstance = null; }
    });

    // ========== REALTIME TÀI XẾ ==========
    function driverRealtime() {
        if (!supabase) return;
        supabase.channel('driver-all')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, (p) => {
                allOrders.unshift(p.new);
                if (currentRole === 'driver') { renderDriverOrders(); toast("🔔 Cuốc mới!"); }
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, (p) => {
                const idx = allOrders.findIndex(o => o.id === p.new.id);
                if (idx >= 0) allOrders[idx] = p.new; else allOrders.unshift(p.new);
                if (currentRole === 'driver') {
                    renderDriverOrders();
                    if (p.new.rating > 0) toast(`🎉 Mẹ chấm ${p.new.rating} SAO!`);
                }
            }).subscribe();
    }

    // ========== MẬT KHẨU ==========
    $('btnConfirmPw').addEventListener('click', () => {
        if ($('pwInput').value.trim() === PASSWORD) {
            $('pwPopup').classList.remove('show');
            currentRole = 'driver';
            showScreen('driverScreen');
            toast("👨‍✈️ Chào Đu Đủ!");
        } else { $('pwError').style.display = 'block'; $('pwInput').value = ''; }
    });
    $('btnCancelPw').addEventListener('click', () => $('pwPopup').classList.remove('show'));
    $('pwInput').addEventListener('keypress', e => { if (e.key === 'Enter') $('btnConfirmPw').click(); });

    // ========== GÁN SỰ KIỆN ==========
    $('btnRoleMom').addEventListener('click', () => { currentRole = 'mom'; showScreen('momScreen'); });
    $('btnRoleDriver').addEventListener('click', () => { $('pwPopup').classList.add('show'); $('pwInput').focus(); });
    $('btnPlaceOrder').addEventListener('click', placeOrder);
    $('btnMomGps').addEventListener('click', getMomGps);
    $('btnSearch').addEventListener('click', searchAddress);
    $('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') searchAddress(); });
    document.querySelectorAll('.quick-loc-btn').forEach(b => b.addEventListener('click', function() {
        moveMomMarker(+this.dataset.lat, +this.dataset.lng, this.dataset.dest);
        $('searchResults').classList.remove('show');
    }));
    $('btnSubmitRating').addEventListener('click', submitRating);
    $('btnSkipRating').addEventListener('click', skipRating);

    function toast(msg, type) {
        const t = document.createElement('div');
        t.className = 'toast ' + (type || '');
        t.textContent = msg;
        $('toastContainer').appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 3000);
    }

    // Khởi tạo
    if (!localStorage.getItem('dudu_points')) localStorage.setItem('dudu_points', '217.7');
    $('loyaltyPoints').textContent = parseFloat(localStorage.getItem('dudu_points')).toFixed(1);
    driverRealtime();
})();
</script>
</body>
</html>
